<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NFO Maker</title>
<link rel="stylesheet" href="style.css?v=1">
<script>
window.addEventListener('error',function(e){var t=e.target;if(!t||!t.src)return;var b=document.getElementById('lf');
if(!b){b=document.createElement('p');b.id='lf';b.style.cssText='background:#e0a82e;color:#12161c;padding:10px;margin:0';document.body.insertBefore(b,document.body.firstChild)}
b.dataset.m=(b.dataset.m?b.dataset.m+', ':'')+t.src.split('/').pop().split('?')[0];b.textContent='Could not load: '+b.dataset.m+'. Check these file names in the v2 folder.'},true);
</script>
</head><body><main>
<h1>NFO Maker</h1>
<details id="kd"><summary>API keys (stored in this browser only)</summary><div>
<input id="tk" placeholder="TMDB API key (v3)" autocomplete="off"><input id="ok" placeholder="OMDb API key" autocomplete="off"><button id="sk">Save keys</button></div></details>
<form id="sf"><select id="ty"><option value="tv">TV show</option><option value="movie">Movie</option></select>
<input id="q" placeholder="Search a title" required><button>Search</button></form>
<details id="ld"><summary>Movie list (many movies at once)</summary><div><textarea id="ml" rows="6" placeholder="One movie per line, e.g. Mayday 2021"></textarea><button id="lm">Match titles</button></div><div id="lr"></div></details>
<details id="rd"><summary>Rename videos (make a .bat script)</summary><div><input id="rs" placeholder="Show name, e.g. Ted Lasso"><textarea id="rl" rows="6" placeholder="Paste file names, one per line (output of dir /b)"></textarea><button id="rp">Preview renames</button></div><div id="rr"></div></details>
<div id="res"></div><div id="cfg"></div><div id="out"></div>
<p class="m" style="font-size:12px">This product uses the TMDB API but is not endorsed or certified by TMDB.</p>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="utils.js?v=1"></script>
<script src="api.js?v=1"></script>
<script src="nfo.js?v=2"></script>
<script src="export.js?v=2"></script>
<script src="list.js?v=1"></script>
<script src="rename.js?v=1"></script>
<script src="main.js?v=2"></script>
</body></html>
